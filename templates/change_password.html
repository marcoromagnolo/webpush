<!DOCTYPE html>
{% include 'head.html' %}
<body>
{% include 'header.html' %}
<main>
<div class="container mt-5">
    <div class="row d-flex justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
        <div class="card-header">
            Change password - {{ username }}
        </div>
        <div class="card-body">
            {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('change_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_access_token }}">
                <div class="row mb-3">
                    <label for="current_password" class="col-sm-4 col-form-label">Current password{{ info("The password you use now.") }}</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" id="current_password" name="current_password"
                               required autocomplete="current-password">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="new_password" class="col-sm-4 col-form-label">New password{{ info("At least 8 characters, different from the current one and from the username.") }}</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" id="new_password" name="new_password"
                               minlength="{{ min_length }}" required autocomplete="new-password">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="confirm_password" class="col-sm-4 col-form-label">Confirm password{{ info("The new password again, to avoid typos.") }}</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               minlength="{{ min_length }}" required autocomplete="new-password">
                    </div>
                </div>
                <input type="submit" class="btn btn-primary" value="Change password">
            </form>
        </div>
    </div>
        </div>
    </div>
</div>


</main>
{% include 'footer.html' %}
</body>
