<!DOCTYPE html>
{% include 'head.html' %}
<body>
<main>
<div class="container mt-5">
    <div class="row d-flex justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
        <div class="card-header">
            Setup
        </div>
        <div class="card-body">
            <div class="alert alert-info" role="alert">
                First access: choose the username and the password of the administrator.
            </div>
            {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('setup') }}">
                <div class="row mb-3">
                    <label for="username" class="col-sm-4 col-form-label">Username{{ info("Name of the administrator of the console: 3-50 characters, letters, numbers, dot, dash or underscore.") }}</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" id="username" name="username" value="{{ username }}"
                               pattern="[A-Za-z0-9._\-]{3,50}" required autocomplete="username">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="password" class="col-sm-4 col-form-label">Password{{ info("At least 8 characters, different from the username. It can be changed later (Change password).") }}</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" id="password" name="password"
                               minlength="{{ min_length }}" required autocomplete="new-password">
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="confirm_password" class="col-sm-4 col-form-label">Confirm password{{ info("The same password again, to avoid typos.") }}</label>
                    <div class="col-sm-8">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               minlength="{{ min_length }}" required autocomplete="new-password">
                    </div>
                </div>
                <input type="submit" class="btn btn-primary" value="Create administrator">
            </form>
        </div>
    </div>
        </div>
    </div>
</div>


</main>
{% include 'footer.html' %}
</body>
